<!DOCTYPE html>
<html>
<head>
    <title>CFB Power Rankings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>College Football Power Rankings</h1>

<p>
My college football power rankings generated using my own statistical model.
</p>


<div id="rankings">
    <p>Loading rankings...</p>
</div>

<script>
fetch("cfb-data/rankings_2025_week_1.csv")
    .then(response => response.text())
    .then(data => {

        
        const rows = data.trim().split("\n");

        let table = `
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team</th>
                        <th>Record</th>
                        <th>Rating</th>
                        <th>Conference</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (let i = 1; i < rows.length; i++) {

            const columns = rows[i].split(",");

            table += `
                <tr>
                    <td>${columns[0]}</td>
                    <td>${columns[1]}</td>
                    <td>${columns[2]}</td>
                    <td>${columns[3]}</td>
                    <td>${columns[5]}</td>
                </tr>
            `;
        }

        table += `
                </tbody>
            </table>
        `;

        document.getElementById("rankings").innerHTML = table;
    });
</script>




<a href="index.html">Back to Home</a>

</body>
</html>
