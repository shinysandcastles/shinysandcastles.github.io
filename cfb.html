<!DOCTYPE html>
<html>
<head>
    <title>CFB Power Rankings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>College Football Power Rankings</h1>

<p>
My college football power rankings generated using my own statistical model.
</p>


<div id="rankings">
    <p>Loading rankings...</p>
</div>

<script>
fetch("cfb-data/rankings_2025_week_1.csv")
    .then(response => response.text())
    .then(data => {
        console.log(data);

        const rows = data.trim().split("\n");

        console.log(rows[1]);

        const columns = rows[1].split(",");
        console.log(columns);



        document.getElementById("rankings").innerHTML = `
            <p>
                ${columns[0]} | ${columns[1]} | ${columns[2]} | ${columns[3]} | ${columns[5]}
            </p>
        `;
    });
</script>




<a href="index.html">Back to Home</a>

</body>
</html>
